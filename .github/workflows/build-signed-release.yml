name: Build permanently signed update APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform and signing tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # The only repository secret needed is a private JSON string generated
      # once by the owner. Never print it, upload it, or commit a key to Git.
      - name: Restore private key in runner memory and build signed release
        env:
          KAKAO_SIGNING_BUNDLE: ${{ secrets.KAKAO_SIGNING_BUNDLE }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, binascii, json, os, pathlib, subprocess, sys, tempfile
          raw = os.environ.get("KAKAO_SIGNING_BUNDLE", "")
          if not raw:
              sys.exit("MISSING SIGNING SECRET: Settings > Secrets and variables > Actions > New repository secret: KAKAO_SIGNING_BUNDLE")
          try:
              info = json.loads(raw)
              if info.get("format") != "kakao-focus-ci-signing-v1":
                  raise ValueError("wrong signing bundle format")
              password = info["password"]
              keyfile = base64.b64decode(info["keystoreBase64"], validate=True)
              if not 6 <= len(password) <= 200 or not 1000 <= len(keyfile) <= 48000:
                  raise ValueError("invalid key/password length")
          except (ValueError, KeyError, TypeError, binascii.Error) as err:
              sys.exit("INVALID SIGNING SECRET: Please enter the entire generated text file as KAKAO_SIGNING_BUNDLE.")

          # Never pass the JSON payload itself to the Gradle child process.
          env = dict(os.environ)
          env.pop("KAKAO_SIGNING_BUNDLE", None)
          with tempfile.TemporaryDirectory(prefix="kakao-key-", dir=os.environ.get("RUNNER_TEMP")) as directory:
              path = pathlib.Path(directory) / "release.p12"
              path.write_bytes(keyfile)
              path.chmod(0o600)
              env["KAKAO_RELEASE_KEYSTORE_PATH"] = str(path)
              env["KAKAO_RELEASE_STORE_PASSWORD"] = password
              subprocess.run(["gradle", ":app:assembleRelease", "--no-daemon"], check=True, env=env)
          PY

      # Verify APK is signed by the fixed public certificate (not a new debug
      # key generated by the runner). This fingerprint is PUBLIC, not a secret.
      - name: Verify unchanged certificate, package ID and build
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          signing_cert=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk")
          printf '%s\n' "$signing_cert"
          printf '%s\n' "$signing_cert" | grep -Fqi "fb74df2d46a6f9c0c140547e5fa1fecfb26c09f8d17fe13e375ab438d0017ae4"
          package_info=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep "^package:")
          printf '%s\n' "$package_info"
          printf '%s\n' "$package_info" | grep -Fq "name='com.kyubang.kakaofocus.stable'"
          sha256sum "$apk"
      - name: Upload permanent-key signed APK (install only this artifact)
        uses: actions/upload-artifact@v4
        with:
          name: kakaofocus-STABLE-SIGNED-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
